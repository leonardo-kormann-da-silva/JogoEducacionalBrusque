<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Cidade de Brusque</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <main class="container">
    <section id="telaInicial">
      <h1 class="titulo">Bora Começar!</h1>
      <p class="subtitulo">Já iremos começar, antes coloque:</p>

      <input type="text" id="nome" placeholder="NOME" required />
      <input type="text" id="escola" placeholder="SUA ESCOLA" required />
      <input type="number" id="idade" placeholder="SUA IDADE" required />

      <button class="botao-principal" onclick="iniciarJogo()">COMEÇAR!</button>
    </section>

    <section id="telaPergunta" class="oculto">
      <div class="info-jogo">
        <span id="numeroPergunta">Pergunta 1 de 15</span>
        <span id="pontuacao">Pontos: 0</span>
      </div>

      <h2 id="textoPergunta" class="pergunta"></h2>

      <img id="imagemPergunta" class="imagem-pergunta" src="" alt="Imagem da pergunta">

      <div id="opcoes" class="opcoes"></div>

      <p id="mensagemResposta" class="mensagem-resposta"></p>

      <button id="botaoProxima" class="oculto" onclick="proximaPergunta()">PRÓXIMA</button>
    </section>

    <section id="telaFinal" class="oculto">
      <h1 class="titulo">Fim do Jogo!</h1>
      <h2 id="resultadoPontos" class="resultado-pontos"></h2>
      <p id="mensagemFinal" class="texto-final"></p>
      <button onclick="reiniciarJogo()">JOGAR NOVAMENTE</button>
    </section>

  </main>

  <div id="alertaPersonalizado" class="alerta-fundo oculto">
    <div class="alerta-caixa">
      <h2>Atenção!</h2>
      <p id="alertaMensagem">Preencha todas as informações antes de começar.</p>
      <button onclick="fecharAlerta()">ENTENDI</button>
    </div>
  </div>

  <script src="perguntas.js"></script>
  <script src="script.js"></script>
</body>
</html>
